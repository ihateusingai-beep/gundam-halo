[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gundam-halo-backend"
version = "0.1.0"
description = "Gundam Halo backend — FastAPI server + MiniMax LLM + Mac control"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Ken Cheng"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "openai>=1.30",                  # MiniMax is OpenAI-compatible
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "rich>=13",
    "python-telegram-bot>=22.6",
    "psutil>=5.9",                   # for Mac system gauges (CPU/RAM/disk/network)
    "watchdog>=4.0",                 # for file system watching
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.4",
    "respx>=0.22",                   # for mocking httpx in tests
]
signal = [
    # signal-cli daemon client (TBD — v2)
]

[project.scripts]
gundam-halo = "gundam_halo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "live: requires running LLM API",
    "mac: requires macOS for full functionality",
]

[tool.ruff]
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
