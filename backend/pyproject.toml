[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gundam-halo-backend"
version = "0.1.0"
description = "Gundam Halo backend — FastAPI server + MiniMax LLM + Mac control"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Ken Cheng"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "openai>=1.30",                  # MiniMax is OpenAI-compatible
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "rich>=13",
    "python-telegram-bot>=22.6",
    "psutil>=5.9",                   # for Mac system gauges (CPU/RAM/disk/network)
    "watchdog>=4.0",                 # for file system watching
    "faiss-cpu>=1.7",                # M12: vector recall (in-memory cosine)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.4",
    "respx>=0.22",                   # for mocking httpx in tests
]
voice = [
    # M1: VAD + ASR
    "onnxruntime>=1.17",             # Silero VAD inference
    "numpy>=1.26,<3",                # Audio array processing
    "openai-whisper>=20231117",      # Local Whisper ASR (v0.1.0–v0.1.3)
    # M2: TTS (sentence splitting + Edge TTS)
    "edge-tts>=7.0",                 # Microsoft Edge TTS (free, no API key)
    "pysbd>=0.3.4",                  # Sentence boundary detection
    # ffmpeg must be installed system-wide for whisper to decode WAV
    # (run: brew install ffmpeg)
]
# M9-E Layer 2 (v0.1.3): Cantonese Whisper fine-tune stack.
# Only needed for the training script; not a runtime dependency.
# Install with: uv sync --extra train --extra voice
train = [
    "transformers>=4.40",            # HF Whisper model + Trainer
    "peft>=0.10",                    # LoRA adapters
    "datasets>=2.18",                # Common Voice yue loader
    "accelerate>=0.27",              # MPS / multi-GPU orchestration
    "jiwer>=3.0",                    # WER evaluation
    "soundfile>=0.12",               # Audio I/O for training data
]
signal = [
    # signal-cli daemon client (TBD — v2)
]
# Sprint 17b: Cantonese ASR via yuesub-api (SenseVoice + fsmn-vad +
# hon9kon9ize BERT corrector). Lifted into Gundam Halo as a second
# ASR backend selectable via `voice.asr.backend = "yuesub"`. Models
# (~2GB) are NOT downloaded by `uv sync` — the user runs
# `scripts/setup-yuesub-models.sh` once to symlink the pre-downloaded
# yuesub-api model dir. See docs/FEATURE-SPEC-SPRINT17b.md §5.6.
#
# NOTE: `funasr_onnx` on PyPI is at 0.4.1 (yuesub-api's inner
# `__version__` reports 1.1.13+ but that's a different namespace).
voice-yuesub = [
    "funasr_onnx>=0.4.1,<1",          # SenseVoiceSmall + Fsmn_vad_online ONNX bindings
    "librosa>=0.10,<1",               # Audio array + STFT (for denoiser)
    "resampy>=0.4,<1",                # 16kHz resampling
    "transformers[onnx]>=4.40",       # BERT corrector + ONNX export
    "opencc>=1.1,<2",                 # OpenCC t2s (Corrector.py imports this)
    "tqdm>=4.66",                     # SenseVoice progress bars
    "modelscope>=1.10,<2",            # Optional: model re-download via download_models.py
    # funasr_onnx 0.4.1 imports `jieba` internally for Chinese
    # tokenization in utils/utils.py (used by Paraformer's BPE
    # tokenizer). PyPI's funasr_onnx install_requires does NOT list
    # jieba (a known packaging gap), so we declare it here.
    "jieba>=0.42,<1",
    # torchaudio provides the MMS_FA forced-aligner used by
    # yuesub-api's `OnnxTranscriber._asr` for token-span alignment
    # (the `aligner = bundle.get_aligner()` call). funasr_onnx
    # itself does NOT include an aligner — we depend on torchaudio
    # here. Note: uv sync may need to drop silero-vad to resolve
    # the numpy<=1.26.4 constraint funasr_onnx requires; if
    # whisper_local users hit a silero-VAD ImportError, see
    # scripts/setup-yuesub-models.sh comments and pin numpy
    # via [tool.uv] constraint.
    "torchaudio>=2.1",
    # pandas is required by the corrector's data loaders
    # (jyutping dictionary, char frequency, t2s mapping).
    # Not pulled in by funasr_onnx's install_requires, so we
    # declare it here. Only loaded when corrector="bert" or
    # corrector="opencc" with regex rules that consult the
    # jyutping dict (current impl: always loads on first
    # correct() call; could be made lazy per corrector mode).
    "pandas>=2,<3",
]

# Sprint 23 (v0.1.4): Hugging Face transformers pipeline
# for fine-tuned Cantonese models. The whisper_hf backend
# (see `app/voice/asr/whisper_hf.py`) loads an HF-format
# checkpoint via `transformers.pipeline(
# "automatic-speech-recognition", model=model_path)`.
# Total extra size: ~850MB (transformers ~250MB, torch CPU
# + MPS wheels ~600MB, accelerate ~50MB, soundfile ~5MB).
# whisper_local / yuesub users do NOT need this extra; the
# factory's whisper_hf branch raises ASRError with a clear
# install hint if the deps are missing.
voice-hf = [
    "transformers>=4.40,<5",      # AutoModelForSpeechSeq2Seq + pipeline
    # torch: the user picks the index based on their Mac.
    # The default CPU + MPS wheel works on M-series; CUDA
    # users can pin a CUDA index. We don't pin a specific
    # torch version because the MPS backend moves quickly.
    "torch>=2.1,<3",
    "accelerate>=0.30,<1",         # transformers device_map support
    "soundfile>=0.12,<1",          # audio I/O for HF processor
]

# Sprint 27: Mark-XL tool imports (see
# docs/FEATURE-SPEC-SPRINT27.md). Each extra is
# independent — the user opts in only for the tools
# they want. Most of the tool impls work without any
# of these extras (they fall back gracefully via
# ImportError or oEmbed), so installing them is
# purely for richer output.
#
# tool-youtube-summarize: `youtube-transcript-api` for
# full transcript support. Without it, the tool
# falls back to YouTube's oEmbed API (title + author
# only).
#
# tool-flight-finder: `playwright` for a future
# real-flight-data extractor (not in v0.1.5+; the
# current tool is a URL builder that needs no
# extra deps). Install this when the user wants
# the real extractor.
#
# tool-send-message: `pyautogui` + `pyperclip` + YOLO
# computer-vision deps (`mss`, `pygetwindow`,
# `onnxruntime`, `numpy`) for the SendMessageTool's
# YOLO-based pyautogui flow (Sprint 30 Track A). The
# tool is a stub if these deps are missing — the user
# gets a clear "deps missing" error pointing at this
# extra. The YOLO model is downloaded separately via
# `scripts/download_yolo_model.py` (~50MB on first use).
tool-youtube-summarize = [
    "youtube-transcript-api>=0.6,<1",
]
tool-flight-finder = [
    "playwright>=1.40,<2",
    # The user runs `playwright install chromium`
    # separately (~150MB browser download).
]
tool-send-message = [
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.8,<2",
    "mss>=9.0,<10",                 # fast screenshot
    "pygetwindow>=0.0.9,<1",        # window bounding box
    "onnxruntime>=1.16,<2",         # YOLO inference
    "numpy>=1.26,<2",               # image preprocessing
    "opencv-python>=4.8,<5",        # image resize (cv2)
    "Pillow>=10.0,<12",             # PIL fallback for resize
]
# Note: tool-web-search needs no extra deps — it
# uses the existing httpx (already in the base venv
# via the `web_fetch` tool).

[project.scripts]
gundam-halo = "gundam_halo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not faiss_native'"
markers = [
    "live: requires running LLM API",
    "mac: requires macOS for full functionality",
    "faiss_native: requires loading the FAISS C++ extension; skipped in mixed-mode runs (Apple Silicon faiss-cpu + torch finalization).",
]

[tool.ruff]
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
